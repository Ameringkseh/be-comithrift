$kind: http-request
url: "{{base_url}}/api/produk/99999"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 404', function () {
          pm.response.to.have.status(404);
      });
      pm.test('Error code is TIDAK_DITEMUKAN', function () {
          const jsonData = pm.response.json();
          pm.expect(jsonData.error.code).to.eql('TIDAK_DITEMUKAN');
      });
    language: text/javascript
order: 3000
