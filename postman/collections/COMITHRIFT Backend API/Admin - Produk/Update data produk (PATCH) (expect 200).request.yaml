$kind: http-request
url: "{{base_url}}/api/admin/produk/1"
method: PATCH
headers:
  Content-Type: application/json
  Authorization: Bearer {{token_relawan}}
body:
  type: text
  content: |-
    {
      "harga": 70000,
      "deskripsi": "Deskripsi produk telah diperbarui oleh relawan."
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () {
          pm.response.to.have.status(200);
      });
      pm.test('Harga terupdate', function () {
          const jsonData = pm.response.json();
          pm.expect(jsonData.data.harga).to.eql(70000);
      });
    language: text/javascript
order: 4000
